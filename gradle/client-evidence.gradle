import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import groovy.xml.XmlSlurper
import java.time.Instant
import java.security.MessageDigest
import javax.imageio.ImageIO

// Shared by the real client task and malformed-manifest fixtures. No Minecraft launch in fixture checks.
ext.validateClientEvidence = { Map request ->
    def require = { boolean ok, String message -> if (!ok) throw new GradleException(message) }
    File modelFile = file(request.model_report)
    File captureFile = file(request.provenance)
    require(modelFile.isFile(), 'Missing current-run model entrypoint report')
    require(captureFile.isFile(), 'Missing current-run capture entrypoint provenance')
    require(modelFile.lastModified() >= request.started_epoch_ms, 'Stale model report')
    require(captureFile.lastModified() >= request.started_epoch_ms, 'Stale capture provenance')
    def model = new XmlSlurper().parse(modelFile)
    def props = model.properties.property.collectEntries { [(it.@name.text()): it.@value.text()] }
    require(props.run_id == request.run_id, 'Mismatched model run ID')
    require(props.entrypoint == 'dev.primeants.gametest.AntModelGameTest', 'Missing named model entrypoint')
    def names = (file('src/gametest/java/dev/primeants/gametest/AntModelGameTest.java').text =~ /(?m)^\s*test\(form,\s*"([^"]+)"/).collect { it[1] }
    def required = ['sixArticulatedLegsOnMesosoma', 'articulatedLegGeometryStaysConnected', 'elbowedAntennaeMandiblesAndEyes', 'onePetioleAndBodySegments',
                    'lowAmplitudeTransformedFootMotion', 'normalAmplitudeTransformedFootMotion', 'amplitudeOneMirroringRegression',
                    'stanceContactTracksVanillaWalkDistance',
                    'stationaryLegsStopWhileAntennaeAnimate', 'bakedUvDensityIs32TexelsPerWorldBlock',
                    'renderedBodyDimensionsMatchForm', 'taperedProfilesConnectedConstrictedWaist']
    require(names.containsAll(required) && names.toSet().size() == names.size(), 'Required model regression discovery incomplete')
    def expected = ['WORKER', 'QUEEN'].collectMany { form -> names.collect { name -> "AntModel.${form}/${name}".toString() } }.toSet()
    def actual = model.testcase.collect { "${it.@classname}/${it.@name}".toString() }
    require(actual.toSet() == expected && actual.size() == expected.size(), 'Executed named model test discovery mismatch')
    require(!model.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] } && model.@failures.text() == '0', 'Model case failed or skipped')
    def capture = new JsonSlurper().parse(captureFile)
    require(capture.run_id == request.run_id, 'Mismatched capture run ID')
    require(capture.capture_prefix == request.capture_prefix, 'Mismatched capture prefix')
    require(capture.entrypoint == 'dev.primeants.gametest.AntCaptureTest', 'Missing named capture entrypoint')
    require(capture.status == 'success' && capture.completed_utc, 'Capture did not complete successfully')
    require(Instant.parse(capture.started_utc).toEpochMilli() >= request.started_epoch_ms, 'Stale capture start')
    long completed = Instant.parse(capture.completed_utc).toEpochMilli()
    boolean foraging = request.scenario == 'foraging'
    boolean growth = request.scenario == 'growth'
    boolean expansion = request.scenario == 'expansion'
    def frames = capture.observations.findAll { it.event == (expansion?'expansion_frame':growth?'growth_frame':foraging ? 'foraging_frame' : 'brood_frame') }
    if(expansion){
        require(frames.size()==4&&frames.collect{it.stage}==['excavation','soil-carrying','expanded-mound','usable-interior'],'Missing real excavation/transport/mound/use sequence')
        require(capture.staged_terrain_edits==0&&capture.ant_teleports==0&&!capture.ai_disabled&&!capture.animation_poses_forced&&capture.injected_brood==0&&capture.injected_food==0&&capture.summoned_workers==0&&capture.reserve_edits==0,'Staged expansion evidence')
        require(capture.stage_ticks==Math.ceil(12000/capture.brood_multiplier)&&capture.callow_ticks==Math.ceil(4800/capture.brood_multiplier)&&capture.laying_cadence==Math.ceil(1200/capture.brood_multiplier)&&capture.initial_body_reserve==39000&&capture.adult_capacity==30,'Changed biological timing/capacity')
        def sources=capture.observations.findAll{it.source_uuid}
        require(sources.size()==2&&sources.every{it.method=='creative inventory -> ordinary client DROP_ALL_ITEMS packet'}&&sources.find{it.item=='minecraft:apple'}?.count==6&&sources.find{it.item=='minecraft:chicken'}?.count==8,'Food must be ordinary real player drops')
        def original=capture.first_generation.original_brood_ids.toSet(),firstWorkers=capture.first_generation.workers.collect{it.uuid}.toSet()
        require(original.size()==3&&firstWorkers.size()==3,'Missing original first clutch')
        frames.eachWithIndex{frame,n->
            def e=frame.extension
            require(frame.uuid==capture.queen_uuid&&frame.ready&&frame.lifecycle=='OPEN'&&frame.phase=='SETTLED'&&frame.owned_openings==2&&frame.live_plugs==0&&frame.body_reserve==0&&frame.underground_grass==0,'Expansion habitat/anchors invalid')
            require(e.planned.size()==12&&e.planned.toSet().size()==12&&e.completed.size()==e.removed&&e.removed<=32&&e.planned.containsAll(e.completed)&&e.problem=='null'&&e.trigger_workers>=4,'Plan/completed/authorized usable space disagree')
            require(24+e.removed==frame.mound_blocks+frame.worker_soil+frame.world_soil+frame.custody_soil,'Actual founding plus extension soil conservation failed')
            require(frame.workers.collect{it.uuid}.toSet().containsAll(firstWorkers)&&frame.original_brood_ids.toSet()==original&&frame.workers.collect{it.uuid}.toSet().size()==frame.workers.size()&&frame.workers.every{it.alive&&it.queen_id==capture.queen_uuid}&&frame.live_adult_count==frame.live_worker_count+1,'Real identities/lineage lost or duplicated')
            require(frame.world_food+frame.custody_food+frame.cache_contents.sum(0){it.count}+frame.workers.findAll{it.cargo_item in ['minecraft:apple','minecraft:chicken','minecraft:sweet_berries']}.sum(0){it.cargo_count}+frame.queen_consumed+frame.larva_consumed==14,'Physical/consumed food conservation failed during work')
            def q=frame.queen_nutrition
            require(q.gained_sugar==q.apples*4000+q.berries*2000&&q.gained_protein==q.chickens*8000&&q.gained_sugar==q.sugar+q.spent_sugar&&q.gained_protein==q.protein+q.spent_protein,'Finite ingested nutrition changed')
            require(frame.workers.count{it.nursing}>=2&&frame.workers.any{it.uuid==frame.worker_claim},'Construction stole nursing or forager')
            if(n<2){def builder=frame.workers.find{it.uuid==frame.subject_uuid};require(builder&&builder.uuid==e.claim&&builder.uuid!=frame.worker_claim&&builder.callow_visual==1000&&builder.cargo_item=='minecraft:dirt'&&builder.cargo_count>0,'Builder is not actual mature worker with physical soil');require(frame.screenshot_render_extractions.any{it.uuid==builder.uuid&&it.carried_soil_rendered&&it.carried_item=='minecraft:dirt'},'Mandible soil was not rendered')}
            if(n>=2)require(e.complete&&e.removed==12&&e.deposited==12&&e.released==0&&e.usable==6&&frame.mound_blocks==36&&frame.worker_soil==0,'Extension/deposition is incomplete')
        }
        require(frames[3].extension_workers>0&&frames[3].extension.use in ['existing_nurse_traversal','brood_emergence']&&frames[3].extension.used_by,'No practical extension use')
        require(frames[3].original_room_workers<frames[0].original_room_workers,'No measured original-room congestion relief')
    }else if(growth){
        require(frames.size()==4&&frames.collect{it.stage}==['nurse-carrying','nurse-feeding','new-brood','additional-callow'],'Missing physical growth sequence')
        require(capture.queen_uuid&&capture.food_source&&capture.staged_terrain_edits==0&&capture.ant_teleports==0&&!capture.ai_disabled&&!capture.animation_poses_forced&&capture.injected_brood==0&&capture.injected_food==0&&capture.summoned_workers==0&&capture.reserve_edits==0,'Staged growth evidence')
        require(capture.stage_ticks==Math.ceil(12000/capture.brood_multiplier)&&capture.callow_ticks==Math.ceil(4800/capture.brood_multiplier)&&capture.laying_cadence==Math.ceil(1200/capture.brood_multiplier)&&capture.initial_body_reserve==39000&&capture.egg_cost==1000&&capture.larva_cost==12000&&capture.adult_capacity==30&&capture.nursery_capacity==3,'Wrong production durations, reserve or capacity')
        def sources=capture.observations.findAll{it.source_uuid}
        require(sources.size()==2&&sources.collect{it.source_uuid}.toSet().size()==2&&sources.every{it.method=='creative inventory -> ordinary client DROP_ALL_ITEMS packet'}&&sources.find{it.item=='minecraft:apple'}?.count==6&&sources.find{it.item=='minecraft:chicken'}?.count==8,'Supplied stacks must be 6 apples and 8 raw chicken from ordinary player packets')
        def original=capture.first_generation.original_brood_ids.toSet()
        def firstWorkers=capture.first_generation.workers.collect{it.uuid}.toSet()
        require(original.size()==3&&firstWorkers.size()==3&&capture.first_generation.workers.every{it.alive&&it.callow_visual==1000&&it.queen_id==capture.queen_uuid}&&capture.first_generation.workers.collect{it.brood_id}.toSet()==original,'First generation must remain identifiable')
        frames.eachWithIndex{frame,n->
            require(frame.uuid==capture.queen_uuid&&frame.form=='queen'&&frame.ready&&!frame.sealed&&frame.phase=='SETTLED'&&frame.lifecycle=='OPEN'&&frame.owned_openings==2&&frame.live_plugs==0&&frame.mound_blocks==24&&frame.worker_soil==0&&frame.underground_grass==0,'Invalid real growth habitat')
            require(frame.original_brood_ids.toSet()==original&&frame.consumed_brood_ids.toSet().containsAll(original)&&frame.workers.collect{it.uuid}.toSet().containsAll(firstWorkers)&&frame.workers.collect{it.uuid}.toSet().size()==frame.workers.size()&&frame.workers.every{it.alive&&it.queen_id==capture.queen_uuid}&&frame.body_reserve==0&&frame.live_worker_count==frame.workers.size()&&frame.live_adult_count==frame.live_worker_count+1,'Changed lineage, duplicate body or replenished reserve')
            require(frame.brood.size()<=3&&frame.occupied_worker_identities>=frame.live_worker_count&&frame.occupied_worker_identities+frame.brood.size()<=29,'Capacity must count real identities including unavailable members')
            require(frame.world_food+frame.custody_food+frame.cache_contents.sum(0){it.count}+frame.workers.findAll{it.cargo_item in ['minecraft:apple','minecraft:sweet_berries','minecraft:chicken']}.sum(0){it.cargo_count}+frame.queen_consumed+frame.larva_consumed==14,'Physical stock plus genuine terminal consumption must conserve all 14 supplied units')
            def q=frame.queen_nutrition;def l=frame.larva_receipts
            require(q.gained_sugar==q.apples*4000+q.berries*2000&&q.gained_protein==q.chickens*8000&&q.gained_sugar==q.sugar+q.spent_sugar&&q.gained_protein==q.protein+q.spent_protein&&q.sugar<=8000&&q.protein<=16000&&frame.queen_consumed==q.apples+q.berries+q.chickens,'Queen credit or finite storage disagrees with actual consumed yields')
            require(l.gained_sugar==l.apples*4000+l.berries*2000&&l.gained_protein==l.chickens*8000&&frame.larva_consumed==l.apples+l.berries+l.chickens,'Larval terminal consumption yields mismatch')
            def newIds=(frame.brood.collect{it.id}+frame.consumed_brood_ids.findAll{!original.contains(it)}).toSet()
            require(!frame.brood.any{original.contains(it.id)||it.founding}&&q.spent_sugar==newIds.size()*1000&&q.spent_protein==newIds.size()*2000,'New egg costs and distinct generation IDs disagree')
            frame.brood.each{r->require(r.gained_sugar==r.apples*4000+r.berries*2000&&r.gained_protein==r.chickens*8000&&r.gained_sugar==r.sugar+r.spent_sugar&&r.gained_protein==r.protein+r.spent_protein&&r.nourishment==r.spent_sugar+r.spent_protein,'Larva must own its finite nutrition')}
            if(n<2){
                def nurse=frame.workers.find{it.uuid==frame.subject_uuid}
                require(nurse&&nurse.uuid!=frame.worker_claim&&nurse.nursing&&nurse.task=='NURSE_FEED'&&nurse.cargo_count==1&&nurse.callow_visual==1000,'Missing eligible physical nurse cargo')
                if(n==1)require(nurse.feeding_ticks>0&&nurse.feeding_ticks<20,'Missing real loaded-tick feeding action')
                require(frame.screenshot_render_extractions.any{it.uuid==nurse.uuid&&it.carried_soil_rendered&&it.carried_item==nurse.cargo_item&&it.client_carried_soil_units==1},'Actual nurse mandible food is not rendered')
            }
            if(n==2)require(frame.brood.any{it.stage=='LARVA'}&&frame.workers.findAll{firstWorkers.contains(it.uuid)}.every{it.callow_visual==1000},'New brood must coexist with mature first generation')
            if(n==3){def pale=frame.workers.find{it.uuid==frame.subject_uuid};require(frame.live_worker_count>3&&pale&&!firstWorkers.contains(pale.uuid)&&!original.contains(pale.brood_id)&&pale.callow_visual<1000&&frame.consumed_brood_ids.contains(pale.brood_id)&&frame.screenshot_render_extractions.any{it.uuid==pale.uuid&&it.callow_visual<1000},'Additional pale worker must emerge from identified new brood')}
        }
        require(capture.final.live_worker_count>3&&capture.final.queen_consumed>0&&capture.final.larva_consumed>0,'Food-fed real growth did not complete')
    }else if (!foraging) {
    require(request.scenario == 'brood', 'Expected first-clutch capture contract')
    require(frames.size() == 5 && frames.collect { it.stage } == ['eggs','larvae','cocoons','callows','mound'], 'Missing captures')
    require(capture.queen_uuid && frames.every { it.uuid == capture.queen_uuid && it.form == 'queen' }, 'Queen identity changed')
    require(capture.staged_terrain_edits == 0 && capture.ant_teleports == 0 && !capture.ai_disabled && !capture.animation_poses_forced
            && capture.injected_brood == 0 && capture.injected_food == 0 && capture.summoned_workers == 0 && capture.reserve_edits == 0, 'Staged first-clutch evidence')
    require(capture.brood_multiplier > 0 && capture.stage_ticks == Math.ceil(12000 / capture.brood_multiplier)
            && capture.callow_ticks == Math.ceil(4800 / capture.brood_multiplier), 'Wrong production development timing')
    require(capture.initial_body_reserve == 39000 && capture.egg_cost == 1000 && capture.larva_cost == 12000, 'Wrong care budget')
    require(capture.final.sealed && capture.final.phase == 'SETTLED' && capture.final.removed == 24 && capture.final.plugged == 2
            && capture.final.deposited == 22 && capture.final.released == 0 && capture.final.mound_blocks == 22, 'Incomplete claustral seal or mound')
    require(frames.collect { it.nursery_ticks } == frames.collect { it.nursery_ticks }.sort(), 'Brood sequence out of order')
    def broodIds = frames[0].brood.collect { it.id }.toSet()
    require(broodIds.size() == 3, 'First clutch must have three distinct identities')
    frames.eachWithIndex { frame,n ->
        require(frame.sealed && frame.phase == 'SETTLED' && frame.brood_multiplier == capture.brood_multiplier
                && frame.underground_grass == 0 && frame.mound_blocks == 22 && frame.live_adult_count == 1 + frame.live_worker_count, 'Invalid nursery/real population')
        if(n < 3) {
            require(frame.live_worker_count == 0 && frame.workers.isEmpty() && frame.brood.size() == 3
                    && frame.brood.collect { it.id }.toSet() == broodIds, 'Premature worker or changed brood ownership')
            require(frame.brood.every { it.queen_id == capture.queen_uuid && it.stage == ['EGG','LARVA','COCOON'][n]
                    && it.progress > 0 && it.progress < capture.stage_ticks }, 'Missing actual brood stage')
            require(frame.body_reserve == 39000 - 3000 - frame.brood.sum { it.nourishment }, 'Care reserve/nourishment mismatch')
            if(n == 2) require(frame.brood.every { it.nourishment == 12000 }, 'Unnourished cocoon')
        } else {
            require(frame.live_worker_count == 3 && frame.workers.size() == 3 && frame.workers.collect { it.uuid }.toSet().size() == 3
                    && frame.workers.collect { it.brood_id }.toSet() == broodIds && frame.workers.every { it.queen_id == capture.queen_uuid && it.alive }
                    && frame.brood.isEmpty() && frame.consumed_brood_ids.toSet() == broodIds && frame.body_reserve == 0, 'Emergence ownership mismatch')
        }
    }
    } else {
        require(frames.size()==4 && frames.collect{it.stage}==['traffic','sugar','protein','cache'], 'Missing physical foraging captures')
        require(capture.queen_uuid && capture.food_source && capture.staged_terrain_edits==0 && capture.ant_teleports==0 && !capture.ai_disabled && !capture.animation_poses_forced
                && capture.injected_brood==0 && capture.injected_food==0 && capture.summoned_workers==0 && capture.reserve_edits==0, 'Staged foraging evidence')
        require(capture.brood_multiplier>0 && capture.stage_ticks==Math.ceil(12000/capture.brood_multiplier) && capture.callow_ticks==Math.ceil(4800/capture.brood_multiplier)
                && capture.initial_body_reserve==39000 && capture.egg_cost==1000 && capture.larva_cost==12000, 'Wrong foraging lineage timing or reserve budget')
        def sources=capture.observations.findAll{it.source_uuid}
        require(sources.size()==2 && sources.collect{it.source_uuid}.toSet().size()==2 && sources.collect{it.item}.toSet()==['minecraft:apple','minecraft:chicken'].toSet()
                && sources.every{it.count==1 && it.method=='creative inventory -> ordinary client DROP_ITEM packet'}, 'Food must come from disclosed ordinary player drops')
        require(capture.final.ready && !capture.final.sealed && capture.final.lifecycle=='OPEN' && capture.final.owned_openings==2
                && capture.final.live_plugs==0 && capture.final.mound_blocks==24 && capture.final.worker_soil==0 && capture.final.world_food==0
                && capture.final.cache_contents.size()==2 && capture.final.cache_capacity==6
                && capture.final.cache_contents.collect{it.item}.toSet()==['minecraft:apple','minecraft:chicken'].toSet()
                && capture.final.cache_contents.every{it.count==1}, 'Incomplete physical operational nest or food cache')
        frames.eachWithIndex { frame,n ->
            require(frame.uuid==capture.queen_uuid && frame.form=='queen' && frame.phase=='SETTLED' && frame.lifecycle=='OPEN' && frame.ready && !frame.sealed
                    && frame.owned_openings==2 && frame.live_plugs==0 && frame.mound_blocks==24 && frame.worker_soil==0 && frame.underground_grass==0, 'Invalid recorded opening or physical soil balance')
            require(frame.live_worker_count==3 && frame.workers.size()==3 && frame.live_adult_count==4 && frame.workers.collect{it.uuid}.toSet().size()==3
                    && frame.consumed_brood_ids.size()==3 && frame.workers.collect{it.brood_id}.toSet()==frame.consumed_brood_ids.toSet()
                    && frame.workers.every{it.queen_id==capture.queen_uuid && it.alive && it.callow_visual==1000} && frame.brood.isEmpty() && frame.body_reserve==0, 'Forager must belong to actual first generation')
            require(frame.world_food + frame.workers.findAll{it.cargo_item in ['minecraft:apple','minecraft:sweet_berries','minecraft:chicken']}.sum(0){it.cargo_count}
                    + frame.cache_contents.sum(0){it.count} == [0,1,2,2][n], 'Actual world/cargo/cache food conservation mismatch')
            if(n in [1,2]) {
                def item=n==1?'minecraft:apple':'minecraft:chicken'
                require(frame.workers.any{it.uuid==frame.worker_claim && it.cargo_item==item && it.cargo_count==1 && it.task=='RETURN'}, 'Missing physical carried food')
                require(frame.screenshot_render_extractions.any{it.uuid==frame.worker_claim && it.form=='worker' && it.carried_item==item && it.carried_soil_rendered && it.client_carried_soil_units==1}, 'Missing production food render')
            }
            if(n==3)require(frame.cache_contents.collect{it.item}.toSet()==['minecraft:apple','minecraft:chicken'].toSet() && frame.cache_contents.every{it.count==1}, 'Missing physical sugary/protein inventory')
        }
    }
    def images = []
    frames.each { frame ->
        require(frame.run_id == request.run_id, 'Mismatched frame run ID')
        require(frame.ai_enabled && frame.normal_physics && frame.work_multiplier == capture.work_multiplier, 'Missing production state/timing')
        require(frame.removed == frame.carried + frame.deposited + frame.released + frame.plugged, 'Soil balance mismatch')
        if(expansion){require(frame.screenshot_render_extractions.any{it.uuid==frame.subject_uuid},'Missing actual expansion subject render')}else if (foraging) {
            require(frame.screenshot_render_extractions.any{it.uuid==(frame.stage=='cache'?capture.queen_uuid:frame.worker_claim)}, 'Missing production colony/worker render')
        } else if (frame.stage != 'mound') require(frame.screenshot_render_extractions.any { it.uuid == capture.queen_uuid && it.form == 'queen' }, 'Missing production queen render')
        if (frame.stage == 'callows') require(frame.workers.every { it.callow_visual < 1000 }
                && frame.screenshot_render_extractions.findAll { it.form == 'worker' && it.callow_visual < 1000 }.collect { it.uuid }.toSet() == frame.workers.collect { it.uuid }.toSet(), 'Missing pale worker renders')
        File png = file(frame.image)
        File expectedPng = new File(request.capture_directory, "${request.capture_prefix}-${frame.stage}.png")
        require(png.canonicalPath == expectedPng.canonicalPath, 'Mismatched PNG path')
        require(png.isFile(), 'Missing PNG')
        require(png.lastModified() == frame.modified_epoch_ms && png.lastModified() >= request.started_epoch_ms, 'Stale or mismatched PNG timestamp')
        require(png.lastModified() >= Instant.parse(frame.capture_started_utc).toEpochMilli() && png.lastModified() <= completed, 'PNG outside capture interval')
        def image = ImageIO.read(png)
        require(image != null && image.width == frame.width && image.height == frame.height && image.width == 1600 && image.height == 1000, 'Mismatched PNG dimensions')
        def hash = MessageDigest.getInstance('SHA-256').digest(png.bytes).encodeHex().toString()
        require(hash == frame.sha256, 'Mismatched PNG hash')
        images.add(png.canonicalPath)
    }
    require(images.toSet().size() == images.size(), 'Duplicate PNG paths')
    [run_id: request.run_id, model_cases: actual.size(), captures: images.size(), names: actual.sort(), status: 'success']
}

tasks.register('testClientEvidenceValidator') {
    dependsOn tasks.named('verifyAntModel')
    doLast {
        File dir = layout.buildDirectory.dir('client-validator-fixtures').get().asFile
        dir.mkdirs()
        long started = System.currentTimeMillis() - 5000
        def request = [run_id:'fixture-current', capture_prefix:'fixture', started_epoch_ms:started,
                       scenario:'brood', capture_directory:dir.absolutePath,
                       model_report:new File(dir,'model.xml').absolutePath, provenance:new File(dir,'capture.json').absolutePath]
        file(request.model_report).text = file('build/test-results/client-model/headless.xml').text.replaceFirst(/name="run_id" value="[^"]*"/, 'name="run_id" value="fixture-current"')
        def capture = [run_id:'fixture-current', capture_prefix:'fixture', entrypoint:'dev.primeants.gametest.AntCaptureTest', status:'success',
                       started_utc:Instant.ofEpochMilli(started).toString(), observations:[], queen_uuid:'fixture-queen', staged_terrain_edits:0, ant_teleports:0,
                       ai_disabled:false, animation_poses_forced:false, work_multiplier:20, brood_multiplier:100,stage_ticks:120,callow_ticks:48,
                       injected_brood:0,injected_food:0,summoned_workers:0,reserve_edits:0,initial_body_reserve:39000,egg_cost:1000,larva_cost:12000,
                       final:[sealed:true,phase:'SETTLED',removed:24,plugged:2,deposited:22,released:0,mound_blocks:22]]
        ['eggs','larvae','cocoons','callows','mound'].eachWithIndex { stage,n ->
            File png = new File(dir, "fixture-${stage}.png")
            ImageIO.write(new java.awt.image.BufferedImage(1600,1000,java.awt.image.BufferedImage.TYPE_INT_RGB), 'png', png)
            def brood = n < 3 ? (0..2).collect { [id:"brood-${it}".toString(),queen_id:'fixture-queen',stage:['EGG','LARVA','COCOON'][n],progress:10,nourishment:[0,1000,12000][n]] } : []
            def workers = n >= 3 ? (0..2).collect { [uuid:"worker-${it}".toString(),brood_id:"brood-${it}".toString(),queen_id:'fixture-queen',alive:true,callow_visual:20] } : []
            def state = [removed:24,carried:0,deposited:22,released:0,plugged:2,phase:'SETTLED',sealed:true,brood:brood,workers:workers,
                         live_worker_count:workers.size(),live_adult_count:workers.size()+1,underground_grass:0,mound_blocks:22,brood_multiplier:100,
                         body_reserve:n<3 ? 36000-brood.sum{it.nourishment} : 0,consumed_brood_ids:n>=3 ? ['brood-0','brood-1','brood-2'] : []]
            capture.observations.add(state + [event:'brood_frame', form:'queen', uuid:'fixture-queen', stage:stage, nursery_ticks:10+n*120,
                run_id:request.run_id, ai_enabled:true,normal_physics:true,work_multiplier:20,
                image:png.absolutePath, modified_epoch_ms:png.lastModified(), capture_started_utc:Instant.ofEpochMilli(started).toString(), width:1600,height:1000,
                sha256:MessageDigest.getInstance('SHA-256').digest(png.bytes).encodeHex().toString(),
                screenshot_render_extractions:[[uuid:'fixture-queen',form:'queen',callow_visual:1000]] + workers.collect { [uuid:it.uuid,form:'worker',callow_visual:20] }])
        }
        capture.completed_utc = Instant.now().toString()
        def save = { value -> file(request.provenance).text = JsonOutput.toJson(value) }
        save(capture)
        def results = [[fixture:'valid-current', result:validateClientEvidence(request).status]]
        def reject = { String name, Map changedRequest, Map changedCapture ->
            save(changedCapture)
            if (name == 'stale-provenance') file(request.provenance).setLastModified(started - 1000)
            File fixture = new File(dir, name); fixture.mkdirs()
            new File(fixture, 'request.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(changedRequest))
            new File(fixture, 'provenance.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(changedCapture))
            new File(fixture, 'model.xml').text = file(request.model_report).text
            try { validateClientEvidence(changedRequest); throw new IllegalStateException("Fixture erroneously accepted: ${name}") }
            catch (GradleException expected) { results.add([fixture:name,result:'rejected',reason:expected.message]); logger.lifecycle("Rejected ${name}: ${expected.message}") }
        }
        reject('stale-provenance', request, capture)
        reject('mismatched-capture-run-id', request, capture + [run_id:'fixture-old'])
        reject('missing-captures', request, capture + [observations:capture.observations.drop(1)])
        reject('missing-capture-entrypoint-with-old-success-present', request + [provenance:new File(dir,'never-created.json').absolutePath], capture)
        reject('wrong-image-hash', request, capture + [observations:capture.observations.collect { it + [sha256:'old'] }])
        reject('wrong-image-timestamp', request, capture + [observations:capture.observations.collect { it + [modified_epoch_ms:0] }])
        reject('wrong-image-dimensions', request, capture + [observations:capture.observations.collect { it + [width:1280] }])
        reject('wrong-image-path', request, capture + [observations:capture.observations.collect { it + [image:new File(dir,'old.png').absolutePath] }])
        reject('missing-named-capture-entrypoint', request, capture + [entrypoint:''])
        reject('queen-identity-changed', request, capture + [observations:capture.observations.collect { it + [uuid:'different'] }])
        reject('missing-production-render', request, capture + [observations:capture.observations.collect { it + [screenshot_render_extractions:[]] }])
        reject('soil-balance-mismatch', request, capture + [observations:capture.observations.collect { it + [removed:999] }])
        reject('incomplete-seal', request, capture + [final:[sealed:false,phase:'ENTERING',removed:24,plugged:0]])
        reject('injected-worker', request, capture + [summoned_workers:1])
        reject('foreign-lineage', request, capture + [observations:capture.observations.collect { it + [brood:it.brood.collect { it + [queen_id:'foreign'] }] }])
        reject('reserve-mismatch', request, capture + [observations:capture.observations.collect { it + [body_reserve:100] }])
        reject('underground-grass', request, capture + [observations:capture.observations.collect { it + [underground_grass:1] }])
        reject('missing-mound', request, capture + [observations:capture.observations.collect { it + [mound_blocks:3] }])
        save(capture)
        file(request.model_report).text = file(request.model_report).text.replace('fixture-current','fixture-old')
        reject('mismatched-model-run-id', request, capture)
        new File(dir,'results.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(results))
    }
}

