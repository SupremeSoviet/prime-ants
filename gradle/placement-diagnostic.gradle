// Scoped headless placement diagnostic. Never enables capture/performance acceptance gates.
def placementSeed=providers.gradleProperty('primeAntsPlacementSeed').getOrElse('unset')
def placementAttempt=providers.gradleProperty('primeAntsPlacementAttempt').getOrElse('unset')
def placementEvidence=providers.gradleProperty('primeAntsPlacementEvidence').getOrElse('unset')
def placementDirectory=layout.buildDirectory.dir('run/t14-placement/'+placementAttempt)
loom.runs.register('placementDiagnostic') {
    server()
    sourceSet.set('gametest')
    runDirectory.set(placementDirectory)
    programArguments.addAll('--nogui','--world','world')
    systemProperties.put('prime_ants.placementSeed',placementSeed)
    systemProperties.put('prime_ants.placementEvidence',placementEvidence)
    systemProperties.put('prime_ants.foundingWorkMultiplier','20')
    systemProperties.put('prime_ants.broodMultiplier','100')
}
tasks.named('runPlacementDiagnostic') {
    doFirst {
        if(!(placementSeed in ['2026100501','42','8675309']) || !(placementAttempt ==~ /t14-seed-[a-z0-9-]+/) || placementEvidence=='unset')
            throw new GradleException('Explicit predeclared seed, owned t14-seed attempt and evidence required')
        if(placementDirectory.get().asFile.exists())throw new GradleException('Placement diagnostic requires a fresh owned world')
        def dir=placementDirectory.get().asFile;dir.mkdirs()
        new File(dir,'eula.txt').text='eula=true\n'
        new File(dir,'server.properties').text='server-ip=127.0.0.1\nserver-port=0\nonline-mode=false\npause-when-empty-seconds=0\nenable-query=false\nenable-rcon=false\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat_all_dimensions\nlevel-seed='+placementSeed+'\n'
        logger.lifecycle('PLACEMENT DIAGNOSTIC ONLY: seed='+placementSeed+' candidate chunks [0..7] x [0..7], FULL halo [-1..8], cap 100 INCLUDING auxiliary FULL chunks; production queue owns placement')
    }
    doLast {
        def result=new groovy.json.JsonSlurper().parse(file(placementEvidence+'/result.json'))
        if(result.full_chunks<64 || result.full_chunks>81 || result.total_full_chunks>100 || result.candidate_region_chunks!=64 || file(placementEvidence+'/failure.json').exists()) throw new GradleException('Bounded placement diagnostic incomplete')
    }
}
