// Scoped headless placement diagnostic. Never enables capture/performance acceptance gates.
def placementSeed=providers.gradleProperty('primeAntsPlacementSeed').getOrElse('unset')
def placementAttempt=providers.gradleProperty('primeAntsPlacementAttempt').getOrElse('unset')
def placementEvidence=providers.gradleProperty('primeAntsPlacementEvidence').getOrElse('unset')
def placementMode=providers.gradleProperty('primeAntsPlacementMode').getOrElse('t14')
def placementDeclaration=providers.gradleProperty('primeAntsPlacementDeclaration').getOrElse('unset')
def isReplay=placementMode=='t18-replay-v1'
def isT15=placementMode=='t15-biome-v1'
def isT17=placementMode=='t17-nectar-v1'
def isT16=placementMode=='t16-frozen-v1'
def fullLimit=(isT16||isT17||isReplay)?150:100
def placementDirectory=layout.buildDirectory.dir('run/'+(isReplay?'t18':isT17?'t17':isT16?'t16':isT15?'t15':'t14')+'-placement/'+placementAttempt)
loom.runs.register('placementDiagnostic') {
    server()
    sourceSet.set('gametest')
    runDirectory.set(placementDirectory)
    programArguments.addAll('--nogui','--world','world')
    systemProperties.put('prime_ants.placementSeed',placementSeed)
    systemProperties.put('prime_ants.placementEvidence',placementEvidence)
    systemProperties.put('prime_ants.placementMode',placementMode)
    systemProperties.put('prime_ants.placementDeclaration',placementDeclaration)
    systemProperties.put('prime_ants.placementPriorFull',providers.gradleProperty('primeAntsPlacementPriorFull').getOrElse('0'))
    systemProperties.put('prime_ants.foundingWorkMultiplier','20')
    systemProperties.put('prime_ants.broodMultiplier','100')
}
tasks.named('runPlacementDiagnostic') {
    doFirst {
        if(!(placementSeed in ['2026100501','42','8675309']) || !(placementAttempt ==~ (isReplay ? /t18-replay-[a-z0-9-]+/ : isT17 ? /t17-seed-[a-z0-9-]+/ : isT16 ? /t16-seed-[a-z0-9-]+/ : isT15 ? /t15-seed-[a-z0-9-]+/ : /t14-seed-[a-z0-9-]+/)) || placementEvidence=='unset')
            throw new GradleException('Explicit predeclared seed, owned turn-specific attempt and evidence required')
        if(isT17) {
            if(placementDeclaration=='unset' || !file(placementDeclaration).isFile())throw new GradleException('Frozen T17 declaration required')
            def d=new groovy.json.JsonSlurper().parse(file(placementDeclaration))
            def expected=[mode:'t17-nectar-v1',seeds:[2026100501],dimension:'prime_ants_test:placement_native',
                max_biome_queries_per_seed:0,selected_per_seed:3,full_halo_radius:3,all_full_limit_per_seed:150,all_full_limit_total:150,
                observation_server_ticks:16000,readiness_limit_server_ticks:300,founding_multiplier:20,brood_multiplier:100,
                nectar_action_ticks:20,nectar_cooldown_ticks:1200,source_duration_multiplier:1,default_enabled:true,sprint:true]
            expected.each{k,v->if(d[k]!=v)throw new GradleException('T17 declaration mismatch: '+k)}
            if(d.imports.size()!=1 || d.imports[0].coordinates!=[[5,9],[9,5],[9,9]])throw new GradleException('Exactly frozen T17 selections required')
        }
        if(isT16) {
            if(placementDeclaration=='unset' || !file(placementDeclaration).isFile())throw new GradleException('Frozen T16 declaration required')
            def d=new groovy.json.JsonSlurper().parse(file(placementDeclaration))
            def expected=[mode:'t16-frozen-v1',seeds:[2026100501,42,8675309],dimension:'prime_ants_test:placement_native',
                max_biome_queries_per_seed:0,selected_per_seed:3,full_halo_radius:3,all_full_limit_per_seed:150,all_full_limit_total:450,
                observation_server_ticks:1000,readiness_limit_server_ticks:300,founding_multiplier:20,brood_multiplier:100,
                search_columns:64,search_min:4,search_max:11,max_evaluations:66,max_insertion_attempts:3,per_tick:2,sprint:true]
            expected.each{k,v->if(d[k]!=v)throw new GradleException('T16 declaration mismatch: '+k)}
            if(d.imports.size()!=3)throw new GradleException('Three hashed imported selections required')
        }
        if(isT15) {
            if(placementDeclaration=='unset' || !file(placementDeclaration).isFile())throw new GradleException('Explicit frozen T15 experiment declaration required')
            def d=new groovy.json.JsonSlurper().parse(file(placementDeclaration))
            def expected=[mode:'t15-biome-v1',seeds:[2026100501,42,8675309],survey_chunk_min:-128,survey_chunk_max:127,
                          survey_order:['squared_distance','x','z'],query_block_offset:[7,80,7],max_biome_queries_per_seed:4096,
                          selected_per_seed:3,full_halo_radius:2,native_full_limit_per_seed:75,all_full_limit_per_seed:100,
                          all_full_limit_total:300,observation_server_ticks:1000,readiness_limit_server_ticks:300,
                          founding_multiplier:20,brood_multiplier:100,sprint:true,default_enabled:false]
            expected.each{k,v->if(d[k]!=v)throw new GradleException('T15 declaration mismatch: '+k)}
        }
        def dir=placementDirectory.get().asFile
        if(isReplay) {
            if(placementDeclaration=='unset' || !file(placementDeclaration).isFile())throw new GradleException('Replay declaration required')
            def d=new groovy.json.JsonSlurper().parse(file(placementDeclaration))
            if(d.mode!='t18-replay-v1'||d.max_full_chunks!=150||d.existing_full_count!=106||d.server_tick_limit!=8000||d.max_biome_queries!=0||d.halo_radius!=3)throw new GradleException('Replay bounds mismatch')
            def marker=new File(dir,'owned-copy.json')
            if(!marker.isFile()||!new File(dir,'world/level.dat').isFile()||new File(dir,'logs').exists())throw new GradleException('Untouched owned replay copy required; never reopen an attempted directory')
            def proof=new groovy.json.JsonSlurper().parse(marker)
            def source=file(d.source_archive)
            def hash={ f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
            if(proof.source_sha256!=d.source_sha256||hash(source)!=d.source_sha256)throw new GradleException('Original replay archive mismatch')
            proof.files.each{k,v->def f=new File(dir,'world/'+k);if(!f.isFile()||hash(f)!=v)throw new GradleException('Owned copy changed before observation: '+k)}
            if(fileTree(new File(dir,'world')).files.size()!=proof.files.size())throw new GradleException('Extra replay world files refused')
        } else {
            if(dir.exists())throw new GradleException('Placement diagnostic requires a fresh owned world')
            dir.mkdirs()
        }
        new File(dir,'eula.txt').text='eula=true\n'
        new File(dir,'server.properties').text='server-ip=127.0.0.1\nserver-port=0\nonline-mode=false\npause-when-empty-seconds=0\nenable-query=false\nenable-rcon=false\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat_all_dimensions\nlevel-seed='+placementSeed+'\n'
        logger.lifecycle('PLACEMENT DIAGNOSTIC ONLY: seed='+placementSeed+' mode='+placementMode+'; production queue owns placement; all-dimension FULL cap '+fullLimit+'')
    }
    doLast {
        def result=new groovy.json.JsonSlurper().parse(file(placementEvidence+'/result.json'))
        if(file(placementEvidence+'/failure.json').exists() || (isReplay?result.budget_used:result.total_full_chunks+(result.prior_full_chunks?:0))>fullLimit)throw new GradleException('Bounded placement diagnostic incomplete')
        if(isT16 && (result.biome_queries!=0 || result.selected.size()!=3 || result.observed_ticks!=1000))throw new GradleException('T16 frozen diagnostic incomplete')
        if(isT17 && (result.biome_queries!=0 || result.selected.size()!=3 || result.observed_ticks!=16000))throw new GradleException('T17 integration incomplete')
        if(isReplay && (result.biome_queries!=0||result.server_ticks>8000||!result.initial_verified))throw new GradleException('Replay bound/initial identity check failed')
        if(!isReplay && !isT16 && !isT17 && (isT15 ? result.full_chunks>75 || result.biome_queries!=4096 || result.selected.size()>3 || result.observed_ticks!=1000 : result.full_chunks<64 || result.full_chunks>81 || result.candidate_region_chunks!=64))throw new GradleException('Turn-specific placement diagnostic incomplete')
    }
}
