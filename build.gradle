plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        prime_ants {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'prime_ants_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

def gameTestReport = layout.buildDirectory.file('test-results/gametest/server.xml')
def serverDiagnosticFilter = providers.gradleProperty('primeAntsServerDiagnosticFilter')
def serverDiagnosticGroup = providers.gradleProperty('primeAntsServerDiagnosticGroup')
// Diagnostic group -> the one GameTest class it runs concurrently. Never acceptance.
def serverDiagnosticGroups = ['nectar':'NectarGameTest', 'colony_stage':'ColonyStageGameTest', 'material_store':'MaterialStoreGameTest',
                              'chamber_scan':'ChamberScanGameTest', 'queens_hall':'QueensHallGameTest', 'material_hauling':'MaterialHaulingGameTest',
                              'nursery_upgrade':'NurseryUpgradeGameTest', 'mound':'MoundGameTest', 'food_cache':'FoodCacheGameTest',
                              'mature_colony':'MatureColonyGameTest']
// A focused diagnostic may validate one case; it must never make check/build green.
gradle.taskGraph.whenReady { graph ->
    if ((serverDiagnosticFilter.isPresent() || serverDiagnosticGroup.isPresent()) && graph.hasTask(':check')) {
        throw new GradleException('Server diagnostic filter is forbidden in check/build; use runGameTest for an explicitly labelled single-case diagnosis')
    }
    if (serverDiagnosticGroup.isPresent() && (!(serverDiagnosticGroup.get() in serverDiagnosticGroups.keySet()) || serverDiagnosticFilter.isPresent()))
        throw new GradleException('Only the explicit concurrent diagnostic groups are supported: ' + serverDiagnosticGroups.keySet())
    if (providers.gradleProperty('primeAntsIdleSeed').isPresent() && !serverDiagnosticFilter.isPresent()) {
        throw new GradleException('Idle seed override is diagnostic only; acceptance uses the declared regression fixtures')
    }
}
loom.runs.named('gameTest') {
    // Loom's deleteGameTestRunDir clears the CLIENT directory only. Preserve prior
    // server worlds as evidence; each invocation gets genuinely new generation.
    runDirectory.set(layout.buildDirectory.dir('run/serverGameTest/' + java.util.UUID.randomUUID().toString()))
    systemProperties.put('prime_ants.naturalPlacement','false') // Ordinary fixtures explicitly opt out; separate test checks unconfigured production default.
    systemProperties.put('prime_ants.broodMultiplier', providers.gradleProperty('primeAntsBroodMultiplier').getOrElse('100'))
    systemProperties.put('prime_ants.foundingWorkMultiplier', providers.gradleProperty('primeAntsFoundingMultiplier').getOrElse('20'))
    if (providers.gradleProperty('primeAntsOriginDiagnostics').isPresent()) systemProperties.put('prime_ants.originDiagnostics', 'true')
    systemProperties.put('fabric-api.gametest.report-file', gameTestReport.get().asFile.absolutePath)
    def groupClass = serverDiagnosticGroup.isPresent() ? serverDiagnosticGroups[serverDiagnosticGroup.get()] : null
    if (serverDiagnosticGroup.isPresent() && groupClass == null) throw new GradleException('Only the explicit concurrent diagnostic groups are supported: ' + serverDiagnosticGroups.keySet())
    systemProperties.put('fabric-api.gametest.filter', groupClass != null ? 'prime_ants_test:' + groupClass.replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase() + '_*' : serverDiagnosticFilter.getOrElse('prime_ants_test:*'))
    if (providers.gradleProperty('primeAntsIdleSeed').isPresent()) systemProperties.put('prime_ants.idleSeed', providers.gradleProperty('primeAntsIdleSeed').get())
}
apply from: 'gradle/client-evidence.gradle'
apply from: 'gradle/restart-evidence.gradle'
apply from: 'gradle/placement-diagnostic.gradle'
apply from: 'gradle/fresh-player-validation.gradle'
def capturePrefix = providers.gradleProperty('primeAntsCapturePrefix').getOrElse('t05-' + java.util.UUID.randomUUID().toString())
def captureRunId = java.util.UUID.randomUUID().toString()
def captureStart = System.currentTimeMillis()
def currentModelReport = file("build/test-results/client-model/${capturePrefix}-model.xml")
def captureRequest = [run_id:captureRunId, capture_prefix:capturePrefix, started_epoch_ms:captureStart,
                      scenario:providers.gradleProperty('primeAntsClientScenario').getOrElse(providers.gradleProperty('primeAntsPlayerBasicsWorld').isPresent()?'player_basics':'expansion'), capture_directory:file('docs/screenshots').absolutePath,
                      model_report:currentModelReport.absolutePath,
                      provenance:file("docs/screenshots/${capturePrefix}-provenance.json").absolutePath]
loom.runs.named('clientGameTest') {
    systemProperties.put('prime_ants.clientWorkload','true')
    if(providers.gradleProperty('primeAntsClientScenario').isPresent()){
        if(providers.gradleProperty('primeAntsClientScenario').get() in ['appearance-t25','appearance-t26']){
            systemProperties.put('prime_ants.clientScenario',providers.gradleProperty('primeAntsClientScenario').get())
            if(providers.gradleProperty('primeAntsAppearanceC2Recovery').getOrElse('false')=='true')
                vmArgs '-XX:CompileCommand=exclude,net.minecraft.resources.ResourceManagerRegistryLoadTask::wrapOperation$zkp000$fabric-loot-api-v3$modifyLootTable'
            ['primeAntsAppearanceSource':'prime_ants.appearanceSource','primeAntsAppearanceRoot':'prime_ants.appearanceRoot','primeAntsAppearanceSpecimen':'prime_ants.appearanceSpecimen','primeAntsAppearancePriorTicks':'prime_ants.appearancePriorTicks'].each { property,key ->
                if(!providers.gradleProperty(property).isPresent())throw new GradleException('Appearance mode requires '+property)
                systemProperties.put(key,providers.gradleProperty(property).get())
            }
            ['primeAntsAppearanceSecondSource':'prime_ants.appearanceSecondSource','primeAntsAppearanceSecondRoot':'prime_ants.appearanceSecondRoot'].each { property,key ->
                if(providers.gradleProperty('primeAntsAppearanceSpecimen').get()=='comparisons'&&!providers.gradleProperty(property).isPresent())throw new GradleException('Combined appearance mode requires '+property)
                if(providers.gradleProperty(property).isPresent())systemProperties.put(key,providers.gradleProperty(property).get())
            }
            ['primeAntsAppearanceTotalBound':'prime_ants.appearanceTotalBound','primeAntsAppearanceAttemptBound':'prime_ants.appearanceAttemptBound','primeAntsAppearanceApples':'prime_ants.appearanceApples','primeAntsAppearanceChickens':'prime_ants.appearanceChickens','primeAntsAppearanceTorches':'prime_ants.appearanceTorches'].each { property,key ->
                if(providers.gradleProperty(property).isPresent())systemProperties.put(key,providers.gradleProperty(property).get())
            }
            systemProperties.put('prime_ants.appearanceAppleAllowed',providers.gradleProperty('primeAntsAppearanceAppleAllowed').getOrElse('false'))
            if(providers.gradleProperty('primeAntsAppearanceFirstSpecimen').isPresent())systemProperties.put('prime_ants.appearanceFirstSpecimen',providers.gradleProperty('primeAntsAppearanceFirstSpecimen').get())
        }else{
        if(providers.gradleProperty('primeAntsClientScenario').get()!='fresh-survival'||providers.gradleProperty('primeAntsPlayerBasicsWorld').isPresent())throw new GradleException('Fresh survival requires client-generated overworld without imported playerBasicsWorld')
        systemProperties.put('prime_ants.clientScenario','fresh-survival')
        systemProperties.put('prime_ants.freshLoadingOnly',providers.gradleProperty('primeAntsFreshLoadingOnly').getOrElse('false'))
        systemProperties.put('prime_ants.freshObserverRecoveryOnly',providers.gradleProperty('primeAntsFreshObserverRecoveryOnly').getOrElse('false'))
        systemProperties.put('prime_ants.freshFoodSyncRecoveryOnly',providers.gradleProperty('primeAntsFreshFoodSyncRecoveryOnly').getOrElse('false'))
        systemProperties.put('prime_ants.playerFood',providers.gradleProperty('primeAntsPlayerFood').getOrElse('apple'))
        if(providers.gradleProperty('primeAntsPriorAppleEvidence').isPresent())systemProperties.put('prime_ants.priorAppleEvidence',providers.gradleProperty('primeAntsPriorAppleEvidence').get())
        systemProperties.put('prime_ants.priorScenarioTicks',providers.gradleProperty('primeAntsPriorScenarioTicks').getOrElse('0'))
        ['primeAntsFreshWorldArchive':'prime_ants.freshWorldArchive','primeAntsKnownSiteRoute':'prime_ants.knownSiteRoute','primeAntsFreshArchiveWorld':'prime_ants.freshArchiveWorld'].each { property,key ->
            if(providers.gradleProperty(property).isPresent())systemProperties.put(key,providers.gradleProperty(property).get())
        }
        }
    }
    if(providers.gradleProperty('primeAntsPlayerBasicsWorld').isPresent()){
        systemProperties.put('prime_ants.playerLoadingProbe',providers.gradleProperty('primeAntsPlayerLoadingProbe').getOrElse('false'))
        systemProperties.put('prime_ants.playerBasicsWorld',providers.gradleProperty('primeAntsPlayerBasicsWorld').get())
        systemProperties.put('prime_ants.naturalPlacement','false') // copied existing diagnostic colony only; no additional spawn-region discovery
    }
    systemProperties.put('prime_ants.foundingWorkMultiplier', providers.gradleProperty('primeAntsFoundingMultiplier').getOrElse('20'))
    systemProperties.put('prime_ants.broodMultiplier', providers.gradleProperty('primeAntsBroodMultiplier').getOrElse('1'))
    systemProperties.put('prime_ants.captureDir', file('docs/screenshots').absolutePath)
    systemProperties.put('prime_ants.capturePrefix', capturePrefix)
    systemProperties.put('prime_ants.runId', captureRunId)
    systemProperties.put('prime_ants.modelReport', currentModelReport.absolutePath)
    systemProperties.put('prime_ants.footTrace', file("build/test-results/client-model/${capturePrefix}-feet.csv").absolutePath)
}

def clientModelReport = layout.buildDirectory.file('test-results/client-model/model.xml')
// Same baked production model tests without a window/world; useful for a failing gait reproducer.
