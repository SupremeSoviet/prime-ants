    mainClass = 'dev.primeants.gametest.AntModelGameTest'
    args '--profiles-only'
    systemProperty 'prime_ants.modelReport', layout.buildDirectory.file('test-results/client-model/baseline-profiles.xml').get().asFile.absolutePath
    systemProperty 'prime_ants.runId', 'baseline-profile-inspection'
}
tasks.named('check') { dependsOn tasks.named('verifyAntModel'), tasks.named('testClientEvidenceValidator') }
tasks.register('verifyNestCacheAssets') {
    doLast {
        def root=file('src/main/resources/assets')
        def atlas=new groovy.json.JsonSlurper().parse(new File(root,'minecraft/atlases/blocks.json'))
        def aliases=atlas.sources.collectEntries{[(it.sprite):it.resource]}
        if(atlas.sources.size()!=6 || !atlas.sources.every{it.type=='minecraft:single' && it.sprite.startsWith('prime_ants:block/cache_')}) throw new GradleException('Cache block atlas aliases incomplete')
        def parts=new groovy.json.JsonSlurper().parse(new File(root,'prime_ants/blockstates/nest_cache.json')).multipart
        if(parts.size()!=36)throw new GradleException('Cache slot projection incomplete')
        def clientJar=fileTree('.gradle/loom-cache/minecraftMaven/net/minecraft').matching{include 'minecraft-clientOnly-*/26.3/*-26.3.jar'}.singleFile
        new java.util.zip.ZipFile(clientJar).withCloseable{jar->
            parts.each{part->
                def path=part.apply.model.replace('prime_ants:','prime_ants/models/')+'.json'
                def model=new groovy.json.JsonSlurper().parse(new File(root,path))
                if(!aliases.containsKey(model.textures.food) || model.textures.particle!=model.textures.food)throw new GradleException('Cache model must resolve food and particles from the block atlas')
                def png='assets/minecraft/textures/'+aliases[model.textures.food].replace('minecraft:','')+'.png'
                if(aliases[model.textures.food].startsWith('prime_ants:')) {
                    def imageFile=new File(root,'prime_ants/textures/'+aliases[model.textures.food].replace('prime_ants:','')+'.png')
                    def img=javax.imageio.ImageIO.read(imageFile);if(img.width!=16 || img.height!=16)throw new GradleException('Nectar sprite must be 16x16');return
                }
                def entry=jar.getEntry(png);if(entry==null)throw new GradleException('Missing pinned vanilla food sprite '+png)
                def img=javax.imageio.ImageIO.read(jar.getInputStream(entry));if(img.width!=16 || img.height!=16)throw new GradleException('Cache sprite must be 16x16')
            }
        }
        logger.lifecycle('Verified 36 cache projections, six block-atlas aliases and 16x16 sprites')
    }
}
tasks.named('check') {dependsOn tasks.named('verifyNestCacheAssets')}
// T04: every material store blockstate part, model and texture reference resolves, and every texture is 16x16. Prime Ants
// textures come from the sources, vanilla ones from the pinned client jar; vanilla block textures need no atlas source.
tasks.register('verifyMaterialStoreAssets') {
    doLast {
        def root=file('src/main/resources/assets')
        def json=new groovy.json.JsonSlurper()
        // T05: clay 0..8 and other stock 0..4 levels, and a lump per other material present (MaterialUnits.display).
        def kinds=['stone','gravel','sand','ore']
        def properties=['clay':(0..8).collect{it.toString()},'stock':(0..4).collect{it.toString()}]+kinds.collectEntries{[(it):['true','false']]}
        def parts=json.parse(new File(root,'prime_ants/blockstates/material_store.json')).multipart
        def shown=[] as Set
        parts.each{part->
            (part.when?:[:]).each{k,v->if(!properties.containsKey(k)||!(v in properties[k]))throw new GradleException("Material store part tests an unknown state ${k}=${v}")}
            if(part.when!=null&&!shown.add(part.when.collect{k,v->"${k}=${v}"}.sort().join(',')))throw new GradleException('Duplicate material store part '+part.when)
        }
        def expected=(1..8).collect{"clay=${it}".toString()}+(1..4).collect{"stock=${it}".toString()}+kinds.collect{"${it}=true".toString()}
        if(parts.size()!=1+expected.size()||shown!=(expected as Set)||parts.count{it.when==null}!=1)throw new GradleException('The pad, every clay level, every stock level and every material lump need exactly one part each')
        def clientJar=fileTree('.gradle/loom-cache/minecraftMaven/net/minecraft').matching{include 'minecraft-clientOnly-*/26.3/*-26.3.jar'}.singleFile
        int textures=0
        new java.util.zip.ZipFile(clientJar).withCloseable{jar->
            parts.collect{it.apply.model}.unique().each{name->
                if(!name.startsWith('prime_ants:block/'))throw new GradleException('Unexpected model '+name)
                def modelFile=new File(root,'prime_ants/models/block/'+name.substring('prime_ants:block/'.length())+'.json')
                if(!modelFile.exists())throw new GradleException('Missing model '+name)
                def model=json.parse(modelFile)
                if(model.parent!=null)throw new GradleException('Material store models are self-contained: '+name)
                model.elements.each{e->e.faces.each{f,face->if(!face.texture.startsWith('#')||!model.textures.containsKey(face.texture.substring(1)))throw new GradleException("Unresolved face texture ${face.texture} in ${name}")}}
                model.textures.each{k,ref->
                    if(ref.startsWith('#')){if(!model.textures.containsKey(ref.substring(1)))throw new GradleException("Unresolved texture variable ${ref} in ${name}");return}
                    def image
                    if(ref.startsWith('prime_ants:')){def f=new File(root,'prime_ants/textures/'+ref.substring('prime_ants:'.length())+'.png');if(!f.exists())throw new GradleException('Missing texture '+ref);image=javax.imageio.ImageIO.read(f)}
                    else if(ref.startsWith('minecraft:')){def entry=jar.getEntry('assets/minecraft/textures/'+ref.substring('minecraft:'.length())+'.png');if(entry==null)throw new GradleException('Missing pinned vanilla texture '+ref);image=javax.imageio.ImageIO.read(jar.getInputStream(entry))}
                    else throw new GradleException('Unexpected texture namespace '+ref)
                    if(image.width!=16||image.height!=16)throw new GradleException('Texture must be 16x16: '+ref)
                    textures++
                }
            }
        }
        logger.lifecycle("Verified ${parts.size()} material store parts, their ${parts.collect{it.apply.model}.unique().size()} models and ${textures} 16x16 texture references")
        // T05: each nest wall block has one blockstate variant, a cube model with its own 16x16 texture, and EN/RU names.
        def walls=['packed_clay','resin_masonry','nest_cut_stone']
        def langs=['en_us','ru_ru'].collectEntries{[(it):json.parse(new File(root,"prime_ants/lang/${it}.json"),'UTF-8')]}
        walls.each{name->
            def variants=json.parse(new File(root,"prime_ants/blockstates/${name}.json")).variants
            if(variants==null||variants.keySet()!=([''] as Set)||variants[''].model!="prime_ants:block/${name}")throw new GradleException('Wall block needs one variant with its own model: '+name)
            def model=json.parse(new File(root,"prime_ants/models/block/${name}.json"))
            if(model.parent!='minecraft:block/cube_all'||model.textures.keySet()!=(['all'] as Set)||model.textures.all!="prime_ants:block/${name}")throw new GradleException('Wall block model must be a cube of its own texture: '+name)
            def image=javax.imageio.ImageIO.read(new File(root,"prime_ants/textures/block/${name}.png"))
            if(image==null||image.width!=16||image.height!=16)throw new GradleException('Wall texture must be 16x16: '+name)
            langs.each{lang,names->if(!(names["block.prime_ants.${name}"] instanceof String)||names["block.prime_ants.${name}"].isBlank())throw new GradleException("Missing ${lang} name for "+name)}
        }
        logger.lifecycle("Verified ${walls.size()} nest wall blocks: one variant, a cube model, a 16x16 texture and EN/RU names each")
    }
}
tasks.named('check') {dependsOn tasks.named('verifyMaterialStoreAssets')}
tasks.named('runClientGameTest') {
    doFirst {
        if (!(capturePrefix ==~ /[a-z0-9][a-z0-9-]*/)) throw new GradleException('Unsafe capture prefix')
        if (fileTree('docs/screenshots').matching { include "${capturePrefix}-*" }.files || currentModelReport.exists())
            throw new GradleException('Capture prefix already used; choose a fresh attempt prefix')
        currentModelReport.parentFile.mkdirs()
        file("build/test-results/client-model/${capturePrefix}-run-request.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(captureRequest))
    }
    doLast {
        def currentLog=file('build/run/clientGameTest/logs/latest.log').getText('UTF-8')
        if(currentLog.contains('Rejecting block model prime_ants:block/cache_') || currentLog.contains('Missing texture references in model prime_ants:block/cache_'))
            throw new GradleException('Current cache visuals contain an atlas/model failure')
        if(providers.gradleProperty('primeAntsClientScenario').getOrElse('') in ['appearance-t25','appearance-t26']){
            def a=new groovy.json.JsonSlurper().parse(file("docs/screenshots/${capturePrefix}-appearance.json"))
            if(a.run_id!=captureRunId||a.status!='closed'||!a.normal_close||!a.normal_server_stop||a.accumulated_ticks>(providers.gradleProperty('primeAntsAppearanceTotalBound').getOrElse('12000') as int)||a.captures.size()<1)throw new GradleException('Appearance capture/closure incomplete')
            def model=new groovy.xml.XmlSlurper().parse(currentModelReport)
            if(model.depthFirst().findAll{it.name()=='testcase'}.size()!=26||model.depthFirst().any{it.name() in ['failure','error','skipped']})throw new GradleException('Appearance launch requires all 26 model cases')
            logger.lifecycle('Appearance observation saved/closed; manual image review remains separate from raw task exit');return
        }
        if(providers.gradleProperty('primeAntsClientScenario').getOrElse('')=='fresh-survival'){
            def f=new groovy.json.JsonSlurper().parse(file("docs/screenshots/${capturePrefix}-fresh.json"))
            if(f.run_id!=captureRunId)throw new GradleException('Stale fresh client evidence')
            def reviewFile=file("docs/screenshots/${capturePrefix}-image-review.json")
            def result=classifyFreshPlayerResult(f,reviewFile.exists()?new groovy.json.JsonSlurper().parse(reviewFile):[:])
            file("build/test-results/client-model/${capturePrefix}-validation.json").setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result)),'UTF-8')
            def model=new groovy.xml.XmlSlurper().parse(currentModelReport)
            def cases=model.depthFirst().findAll{it.name()=='testcase'}
            def names=(file('src/gametest/java/dev/primeants/gametest/AntModelGameTest.java').text =~ /test\(form, "(\w+)"/).collect{it[1]}.toSet()-['profilesOnly']
            def expected=['WORKER','QUEEN'].collectMany{form->names.collect{'AntModel.'+form+':'+it}}.toSet()
            if(cases.size()!=26||cases.collect{it.@classname.text()+':'+it.@name.text()}.toSet()!=expected||model.depthFirst().any{it.name() in ['failure','error','skipped']})throw new GradleException('Fresh client must also execute every current model name without failure/skip')
            if(!result.checkpoint_success&&result.state!='loading_only'&&!(result.state=='observer_recovery_only'&&providers.gradleProperty('primeAntsFreshObserverRecoveryOnly').getOrElse('false')=='true')&&!(result.state=='food_sync_recovery_only'&&providers.gradleProperty('primeAntsFreshFoodSyncRecoveryOnly').getOrElse('false')=='true'))throw new GradleException("Player checkpoint incomplete/rejected: ${result.state}; loading/closure remain separate")
            logger.lifecycle("Fresh client result: ${result.state}; checkpoint_success=${result.checkpoint_success}");return
        }
        if(providers.gradleProperty('primeAntsPlayerLoadingProbe').getOrElse('false')=='true'){
            def p=new groovy.json.JsonSlurper().parse(file("docs/screenshots/${capturePrefix}-provenance.json"))
            if(p.status!='success'||p.scenario!='loading_probe')throw new GradleException('Retired imported diagnostic failed; it is not fresh-world acceptance')
            logger.lifecycle('HISTORICAL DIAGNOSTIC ONLY: imported path is excluded from fresh survival acceptance');return
        }
        def result = validateClientEvidence(captureRequest)
        file("build/test-results/client-model/${capturePrefix}-validation.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
        logger.lifecycle("Verified current run ${captureRunId}: ${result.model_cases} named model cases, ${result.captures} fresh captures")
    }
}

// Loom connects runGameTest to check. Also reject a vacuous or stale report.
tasks.named('runGameTest') {
    mustRunAfter tasks.named('test')
    doFirst {
        delete gameTestReport
        logger.lifecycle("Fresh server GameTest directory: ${loom.runs.named('gameTest').get().runDirectory.get().asFile}")
    }
    doLast {
        def report = new groovy.xml.XmlSlurper().parse(gameTestReport.get().asFile)
        def cases = report.depthFirst().findAll { it.name() == 'testcase' }
        if (serverDiagnosticGroup.isPresent()) {
            def groupClass = serverDiagnosticGroups[serverDiagnosticGroup.get()]
            def groupPrefix = groupClass.replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase()
            def expected = (file("src/gametest/java/dev/primeants/gametest/${groupClass}.java").text =~ /public void (\w+)\(GameTestHelper c\)/).collect {
                "prime_ants_test:${groupPrefix}_" + it[1].replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase()
            }
            if (cases.collect { it.@name.text() }.toSet() != expected.toSet() || cases.size() != expected.size()
                    || report.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] })
                throw new GradleException("Concurrent ${serverDiagnosticGroup.get()} diagnostic did not execute all requested passing names")
            logger.lifecycle("DIAGNOSTIC ONLY: ${cases.size()} concurrent ${serverDiagnosticGroup.get()} cases; acceptance not claimed")
            return
        }
        if (serverDiagnosticFilter.isPresent()) {
            if (cases.size() != 1 || cases[0].@name.text() != serverDiagnosticFilter.get()
                    || report.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] })
                throw new GradleException('Single-case diagnostic did not execute the requested passing server test')
            logger.lifecycle("DIAGNOSTIC ONLY: ${serverDiagnosticFilter.get()}; complete server suite not claimed")
            return
        }
        if (cases.isEmpty() || !cases.any { it.@name.text() == 'prime_ants_test:bootstrap_game_test_food_item_lifecycle' }) {
            throw new GradleException('Expected bootstrap GameTest was not executed')
        }
        def antTests = ['worker_navigates_ground_around_wall', 'queen_navigates_ground_around_wall',
                        'worker_age_ignores_daylight_changes', 'queen_age_ignores_daylight_changes',
                        'worker_lethal_damage_has_no_replacement', 'queen_lethal_damage_has_no_replacement',
                        'worker_entity_serialization_preserves_identity', 'queen_entity_serialization_preserves_identity',
                        'survival_egg_creates_nothing', 'creative_egg_creates_exactly_one_queen',
                        'operator_survival_egg_creates_exactly_one_queen', 'null_player_egg_cannot_spawn',
                        'debug_egg_cannot_configure_spawner', 'dispenser_cannot_bypass_egg_restriction',
                        'queen_wanders_after_long_idle', 'queen_wanders_after_sparse_land_candidates',
                        'queen_wanders_after_null_land_candidates', 'queen_wanders_after_long_idle_odd_phase',
