plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        prime_ants {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'prime_ants_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

def gameTestReport = layout.buildDirectory.file('test-results/gametest/server.xml')
def serverDiagnosticFilter = providers.gradleProperty('primeAntsServerDiagnosticFilter')
// A focused diagnostic may validate one case; it must never make check/build green.
gradle.taskGraph.whenReady { graph ->
    if (serverDiagnosticFilter.isPresent() && graph.hasTask(':check')) {
        throw new GradleException('Server diagnostic filter is forbidden in check/build; use runGameTest for an explicitly labelled single-case diagnosis')
    }
}
loom.runs.named('gameTest') {
    systemProperties.put('fabric-api.gametest.report-file', gameTestReport.get().asFile.absolutePath)
    systemProperties.put('fabric-api.gametest.filter', serverDiagnosticFilter.getOrElse('prime_ants_test:*'))
}
apply from: 'gradle/client-evidence.gradle'
def capturePrefix = providers.gradleProperty('primeAntsCapturePrefix').getOrElse('t03-' + java.util.UUID.randomUUID().toString())
def captureRunId = java.util.UUID.randomUUID().toString()
def captureStart = System.currentTimeMillis()
def currentModelReport = file("build/test-results/client-model/${capturePrefix}-model.xml")
def captureRequest = [run_id:captureRunId, capture_prefix:capturePrefix, started_epoch_ms:captureStart,
                      frames_per_view:12, capture_directory:file('docs/screenshots').absolutePath,
                      model_report:currentModelReport.absolutePath,
                      provenance:file("docs/screenshots/${capturePrefix}-provenance.json").absolutePath]
loom.runs.named('clientGameTest') {
    systemProperties.put('prime_ants.captureDir', file('docs/screenshots').absolutePath)
    systemProperties.put('prime_ants.capturePrefix', capturePrefix)
    systemProperties.put('prime_ants.runId', captureRunId)
    systemProperties.put('prime_ants.modelReport', currentModelReport.absolutePath)
    systemProperties.put('prime_ants.footTrace', file("build/test-results/client-model/${capturePrefix}-feet.csv").absolutePath)
}

def clientModelReport = layout.buildDirectory.file('test-results/client-model/model.xml')
// Same baked production model tests without a window/world; useful for a failing gait reproducer.
tasks.register('verifyAntModel', JavaExec) {
    dependsOn tasks.named('gametestClasses')
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.primeants.gametest.AntModelGameTest'
    systemProperty 'prime_ants.modelReport', layout.buildDirectory.file('test-results/client-model/headless.xml').get().asFile.absolutePath
    systemProperty 'prime_ants.footTrace', layout.buildDirectory.file('test-results/client-model/headless-feet.csv').get().asFile.absolutePath
    systemProperty 'prime_ants.runId', 'headless-' + java.util.UUID.randomUUID().toString()
}
tasks.register('inspectAntBaselineProfiles', JavaExec) {
    dependsOn tasks.named('gametestClasses')
    classpath = files(providers.gradleProperty('primeAntsBaselineJar').getOrElse('build/libs/prime_ants-0.1.0.jar')) + sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.primeants.gametest.AntModelGameTest'
    args '--profiles-only'
    systemProperty 'prime_ants.modelReport', layout.buildDirectory.file('test-results/client-model/baseline-profiles.xml').get().asFile.absolutePath
    systemProperty 'prime_ants.runId', 'baseline-profile-inspection'
}
tasks.named('check') { dependsOn tasks.named('verifyAntModel'), tasks.named('testClientEvidenceValidator') }
tasks.named('runClientGameTest') {
    doFirst {
        if (!(capturePrefix ==~ /[a-z0-9][a-z0-9-]*/)) throw new GradleException('Unsafe capture prefix')
        if (fileTree('docs/screenshots').matching { include "${capturePrefix}-*" }.files || currentModelReport.exists())
            throw new GradleException('Capture prefix already used; choose a fresh attempt prefix')
        currentModelReport.parentFile.mkdirs()
        file("build/test-results/client-model/${capturePrefix}-run-request.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(captureRequest))
    }
    doLast {
        def result = validateClientEvidence(captureRequest)
        file("build/test-results/client-model/${capturePrefix}-validation.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
        logger.lifecycle("Verified current run ${captureRunId}: ${result.model_cases} named model cases, ${result.captures} fresh captures")
    }
}

// Loom connects runGameTest to check. Also reject a vacuous or stale report.
tasks.named('runGameTest') {
    mustRunAfter tasks.named('test')
    doFirst { delete gameTestReport }
    doLast {
        def report = new groovy.xml.XmlSlurper().parse(gameTestReport.get().asFile)
        def cases = report.depthFirst().findAll { it.name() == 'testcase' }
        if (serverDiagnosticFilter.isPresent()) {
            if (cases.size() != 1 || cases[0].@name.text() != serverDiagnosticFilter.get()
                    || report.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] })
                throw new GradleException('Single-case diagnostic did not execute the requested passing server test')
            logger.lifecycle("DIAGNOSTIC ONLY: ${serverDiagnosticFilter.get()}; complete server suite not claimed")
            return
        }
        if (cases.isEmpty() || !cases.any { it.@name.text() == 'prime_ants_test:bootstrap_game_test_food_item_lifecycle' }) {
            throw new GradleException('Expected bootstrap GameTest was not executed')
        }
        def antTests = ['worker_navigates_ground_around_wall', 'queen_navigates_ground_around_wall',
                        'worker_age_ignores_daylight_changes', 'queen_age_ignores_daylight_changes',
                        'worker_lethal_damage_has_no_replacement', 'queen_lethal_damage_has_no_replacement',
                        'worker_entity_serialization_preserves_identity', 'queen_entity_serialization_preserves_identity',
                        'survival_egg_creates_nothing', 'creative_egg_creates_exactly_one_queen',
                        'operator_survival_egg_creates_exactly_one_queen', 'null_player_egg_cannot_spawn',
                        'debug_egg_cannot_configure_spawner', 'dispenser_cannot_bypass_egg_restriction',
                        'queen_wanders_after_long_idle']
        antTests.each { name ->
            if (!cases.any { it.@name.text() == "prime_ants_test:ant_entity_game_test_${name}" }) {
                throw new GradleException("Expected ant GameTest was not executed: ${name}")
            }
        }
        if (report.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] }) {
            throw new GradleException('Server GameTest report contains a failure or skipped test')
        }
        logger.lifecycle("Verified server GameTest report: ${cases.size()} executed, 0 failed, 0 skipped")
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    testLogging { events 'passed', 'skipped', 'failed' }
}
