plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        prime_ants {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'prime_ants_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

def gameTestReport = layout.buildDirectory.file('test-results/gametest/server.xml')
def serverDiagnosticFilter = providers.gradleProperty('primeAntsServerDiagnosticFilter')
// A focused diagnostic may validate one case; it must never make check/build green.
gradle.taskGraph.whenReady { graph ->
    if (serverDiagnosticFilter.isPresent() && graph.hasTask(':check')) {
        throw new GradleException('Server diagnostic filter is forbidden in check/build; use runGameTest for an explicitly labelled single-case diagnosis')
    }
    if (providers.gradleProperty('primeAntsIdleSeed').isPresent() && !serverDiagnosticFilter.isPresent()) {
        throw new GradleException('Idle seed override is diagnostic only; acceptance uses the declared regression fixtures')
    }
}
loom.runs.named('gameTest') {
    // Loom's deleteGameTestRunDir clears the CLIENT directory only. Preserve prior
    // server worlds as evidence; each invocation gets genuinely new generation.
    runDirectory.set(layout.buildDirectory.dir('run/serverGameTest/' + java.util.UUID.randomUUID().toString()))
    systemProperties.put('prime_ants.naturalPlacement','false') // Ordinary fixtures explicitly opt out; separate test checks unconfigured production default.
    systemProperties.put('prime_ants.broodMultiplier', providers.gradleProperty('primeAntsBroodMultiplier').getOrElse('100'))
    systemProperties.put('prime_ants.foundingWorkMultiplier', providers.gradleProperty('primeAntsFoundingMultiplier').getOrElse('20'))
    if (providers.gradleProperty('primeAntsOriginDiagnostics').isPresent()) systemProperties.put('prime_ants.originDiagnostics', 'true')
    systemProperties.put('fabric-api.gametest.report-file', gameTestReport.get().asFile.absolutePath)
    systemProperties.put('fabric-api.gametest.filter', serverDiagnosticFilter.getOrElse('prime_ants_test:*'))
    if (providers.gradleProperty('primeAntsIdleSeed').isPresent()) systemProperties.put('prime_ants.idleSeed', providers.gradleProperty('primeAntsIdleSeed').get())
}
apply from: 'gradle/client-evidence.gradle'
apply from: 'gradle/restart-evidence.gradle'
apply from: 'gradle/placement-diagnostic.gradle'
def capturePrefix = providers.gradleProperty('primeAntsCapturePrefix').getOrElse('t05-' + java.util.UUID.randomUUID().toString())
def captureRunId = java.util.UUID.randomUUID().toString()
def captureStart = System.currentTimeMillis()
def currentModelReport = file("build/test-results/client-model/${capturePrefix}-model.xml")
def captureRequest = [run_id:captureRunId, capture_prefix:capturePrefix, started_epoch_ms:captureStart,
                      scenario:providers.gradleProperty('primeAntsPlayerBasicsWorld').isPresent()?'player_basics':'expansion', capture_directory:file('docs/screenshots').absolutePath,
                      model_report:currentModelReport.absolutePath,
                      provenance:file("docs/screenshots/${capturePrefix}-provenance.json").absolutePath]
loom.runs.named('clientGameTest') {
    if(providers.gradleProperty('primeAntsPlayerBasicsWorld').isPresent()){
        systemProperties.put('prime_ants.playerBasicsWorld',providers.gradleProperty('primeAntsPlayerBasicsWorld').get())
        systemProperties.put('prime_ants.naturalPlacement','false') // copied existing diagnostic colony only; no additional spawn-region discovery
    }
    systemProperties.put('prime_ants.foundingWorkMultiplier', providers.gradleProperty('primeAntsFoundingMultiplier').getOrElse('20'))
    systemProperties.put('prime_ants.broodMultiplier', providers.gradleProperty('primeAntsBroodMultiplier').getOrElse('1'))
    systemProperties.put('prime_ants.captureDir', file('docs/screenshots').absolutePath)
    systemProperties.put('prime_ants.capturePrefix', capturePrefix)
    systemProperties.put('prime_ants.runId', captureRunId)
    systemProperties.put('prime_ants.modelReport', currentModelReport.absolutePath)
    systemProperties.put('prime_ants.footTrace', file("build/test-results/client-model/${capturePrefix}-feet.csv").absolutePath)
}

def clientModelReport = layout.buildDirectory.file('test-results/client-model/model.xml')
// Same baked production model tests without a window/world; useful for a failing gait reproducer.
tasks.register('verifyAntModel', JavaExec) {
    dependsOn tasks.named('gametestClasses')
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.primeants.gametest.AntModelGameTest'
    systemProperty 'prime_ants.modelReport', layout.buildDirectory.file('test-results/client-model/headless.xml').get().asFile.absolutePath
    systemProperty 'prime_ants.footTrace', layout.buildDirectory.file('test-results/client-model/headless-feet.csv').get().asFile.absolutePath
    systemProperty 'prime_ants.runId', 'headless-' + java.util.UUID.randomUUID().toString()
}
tasks.register('inspectAntBaselineProfiles', JavaExec) {
    dependsOn tasks.named('gametestClasses')
    classpath = files(providers.gradleProperty('primeAntsBaselineJar').getOrElse('build/libs/prime_ants-0.1.0.jar')) + sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.primeants.gametest.AntModelGameTest'
    args '--profiles-only'
    systemProperty 'prime_ants.modelReport', layout.buildDirectory.file('test-results/client-model/baseline-profiles.xml').get().asFile.absolutePath
    systemProperty 'prime_ants.runId', 'baseline-profile-inspection'
}
tasks.named('check') { dependsOn tasks.named('verifyAntModel'), tasks.named('testClientEvidenceValidator') }
tasks.register('verifyNestCacheAssets') {
    doLast {
        def root=file('src/main/resources/assets')
        def atlas=new groovy.json.JsonSlurper().parse(new File(root,'minecraft/atlases/blocks.json'))
        def aliases=atlas.sources.collectEntries{[(it.sprite):it.resource]}
        if(atlas.sources.size()!=6 || !atlas.sources.every{it.type=='minecraft:single' && it.sprite.startsWith('prime_ants:block/cache_')}) throw new GradleException('Cache block atlas aliases incomplete')
        def parts=new groovy.json.JsonSlurper().parse(new File(root,'prime_ants/blockstates/nest_cache.json')).multipart
        if(parts.size()!=36)throw new GradleException('Cache slot projection incomplete')
        def clientJar=fileTree('.gradle/loom-cache/minecraftMaven/net/minecraft').matching{include 'minecraft-clientOnly-*/26.3/*-26.3.jar'}.singleFile
        new java.util.zip.ZipFile(clientJar).withCloseable{jar->
            parts.each{part->
                def path=part.apply.model.replace('prime_ants:','prime_ants/models/')+'.json'
                def model=new groovy.json.JsonSlurper().parse(new File(root,path))
                if(!aliases.containsKey(model.textures.food) || model.textures.particle!=model.textures.food)throw new GradleException('Cache model must resolve food and particles from the block atlas')
                def png='assets/minecraft/textures/'+aliases[model.textures.food].replace('minecraft:','')+'.png'
                if(aliases[model.textures.food].startsWith('prime_ants:')) {
                    def imageFile=new File(root,'prime_ants/textures/'+aliases[model.textures.food].replace('prime_ants:','')+'.png')
                    def img=javax.imageio.ImageIO.read(imageFile);if(img.width!=16 || img.height!=16)throw new GradleException('Nectar sprite must be 16x16');return
                }
                def entry=jar.getEntry(png);if(entry==null)throw new GradleException('Missing pinned vanilla food sprite '+png)
                def img=javax.imageio.ImageIO.read(jar.getInputStream(entry));if(img.width!=16 || img.height!=16)throw new GradleException('Cache sprite must be 16x16')
            }
        }
        logger.lifecycle('Verified 36 cache projections, six block-atlas aliases and 16x16 sprites')
    }
}
tasks.named('check') {dependsOn tasks.named('verifyNestCacheAssets')}
tasks.named('runClientGameTest') {
    doFirst {
        if (!(capturePrefix ==~ /[a-z0-9][a-z0-9-]*/)) throw new GradleException('Unsafe capture prefix')
        if (fileTree('docs/screenshots').matching { include "${capturePrefix}-*" }.files || currentModelReport.exists())
            throw new GradleException('Capture prefix already used; choose a fresh attempt prefix')
        currentModelReport.parentFile.mkdirs()
        file("build/test-results/client-model/${capturePrefix}-run-request.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(captureRequest))
    }
    doLast {
        def currentLog=file('build/run/clientGameTest/logs/latest.log').getText('UTF-8')
        if(currentLog.contains('Rejecting block model prime_ants:block/cache_') || currentLog.contains('Missing texture references in model prime_ants:block/cache_'))
            throw new GradleException('Current cache visuals contain an atlas/model failure')
        def result = validateClientEvidence(captureRequest)
        file("build/test-results/client-model/${capturePrefix}-validation.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
        logger.lifecycle("Verified current run ${captureRunId}: ${result.model_cases} named model cases, ${result.captures} fresh captures")
    }
}

// Loom connects runGameTest to check. Also reject a vacuous or stale report.
tasks.named('runGameTest') {
    mustRunAfter tasks.named('test')
    doFirst {
        delete gameTestReport
        logger.lifecycle("Fresh server GameTest directory: ${loom.runs.named('gameTest').get().runDirectory.get().asFile}")
    }
    doLast {
        def report = new groovy.xml.XmlSlurper().parse(gameTestReport.get().asFile)
        def cases = report.depthFirst().findAll { it.name() == 'testcase' }
        if (serverDiagnosticFilter.isPresent()) {
            if (cases.size() != 1 || cases[0].@name.text() != serverDiagnosticFilter.get()
                    || report.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] })
                throw new GradleException('Single-case diagnostic did not execute the requested passing server test')
            logger.lifecycle("DIAGNOSTIC ONLY: ${serverDiagnosticFilter.get()}; complete server suite not claimed")
            return
        }
        if (cases.isEmpty() || !cases.any { it.@name.text() == 'prime_ants_test:bootstrap_game_test_food_item_lifecycle' }) {
            throw new GradleException('Expected bootstrap GameTest was not executed')
        }
        def antTests = ['worker_navigates_ground_around_wall', 'queen_navigates_ground_around_wall',
                        'worker_age_ignores_daylight_changes', 'queen_age_ignores_daylight_changes',
                        'worker_lethal_damage_has_no_replacement', 'queen_lethal_damage_has_no_replacement',
                        'worker_entity_serialization_preserves_identity', 'queen_entity_serialization_preserves_identity',
                        'survival_egg_creates_nothing', 'creative_egg_creates_exactly_one_queen',
                        'operator_survival_egg_creates_exactly_one_queen', 'null_player_egg_cannot_spawn',
                        'debug_egg_cannot_configure_spawner', 'dispenser_cannot_bypass_egg_restriction',
                        'queen_wanders_after_long_idle', 'queen_wanders_after_sparse_land_candidates',
                        'queen_wanders_after_null_land_candidates', 'queen_wanders_after_long_idle_odd_phase',
                        'queen_wanders_after_sparse_land_candidates_even_phase', 'queen_wanders_after_null_land_candidates_even_phase',
                        'queen_wanders_to_adjacent_land_candidate',
                        'capture_ground_rejects_obstructions_and_incomplete_footprints']
        antTests.each { name ->
            if (!cases.any { it.@name.text() == "prime_ants_test:ant_entity_game_test_${name}" }) {
                throw new GradleException("Expected ant GameTest was not executed: ${name}")
            }
        }
        ['founding_excavates_transports_walks_and_seals_over_real_ticks',
         'transport_finishes_vertical_column_before_leaving_exposed_pending_soil',
         'side_wall_opened_during_sealing_prevents_settlement','placed_plug_removed_before_settlement_prevents_settlement',
         'chamber_obstructed_during_sealing_prevents_settlement','invalid_settled_enclosure_stays_unready_through_save_load',
         'settled_readiness_requires_queen_inside',
         'genuine_native_soil_generation_records_and_revokes_origin',
         'unknown_origin_soil_remains_untouched','pre_queen_player_placed_matching_soil_remains_untouched',
         'unsuitable_substrates_remain_untouched','ordinary_player_replacement_invalidates_planned_task',
         'genuine_generation_and_chunk_reload_cannot_grant_unknown_origin','interrupted_founding_and_protection_persist_through_save_load',
         'queen_death_releases_carried_soil_once_and_stops_work','settled_queen_may_touch_enclosure_face_without_crossing_it','compacted_seal_keeps_owned_soil_beside_grass_over_real_ticks'].each { name ->
            if (!cases.any { it.@name.text() == "prime_ants_test:queen_founding_game_test_${name}" }) throw new GradleException("Missing founding test: ${name}")
        }
        def broodNames = (file('src/gametest/java/dev/primeants/gametest/BroodGameTest.java').text =~ /public void (\w+)\(GameTestHelper c\)/).collect { it[1].replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase() }
        if (broodNames.size() != 12) throw new GradleException('Brood test discovery incomplete')
        broodNames.each { name ->
            if (!cases.any { it.@name.text() == "prime_ants_test:brood_game_test_${name}" }) throw new GradleException("Missing brood test: ${name}")
        }
        def workerNames = (file('src/gametest/java/dev/primeants/gametest/WorkerForagingGameTest.java').text =~ /public void (\w+)\(GameTestHelper c\)/).collect { it[1].replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase() }
        if (workerNames.size() != 11) throw new GradleException('Worker foraging discovery incomplete')
        workerNames.each { name ->
            if (!cases.any { it.@name.text() == "prime_ants_test:worker_foraging_game_test_${name}" }) throw new GradleException("Missing worker test: ${name}")
        }
        def transferNames = (file('src/gametest/java/dev/primeants/gametest/TransferGameTest.java').text =~ /public void (\w+)\(GameTestHelper c\)/).collect { it[1].replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase() }
        if (transferNames.size() != 4) throw new GradleException('Transfer refusal discovery incomplete')
        transferNames.each { name ->
            if (!cases.any { it.@name.text() == "prime_ants_test:transfer_game_test_${name}" }) throw new GradleException("Missing transfer test: ${name}")
        }
        ['NursingGameTest':1,'NursingGuardGameTest':10,'ExpansionGameTest':14,'RoleConflictGameTest':7].each { className,count ->
            def names=(file("src/gametest/java/dev/primeants/gametest/${className}.java").text =~ /public void (\w+)\(GameTestHelper c\)/).collect {it[1].replaceAll(/([a-z0-9])([A-Z])/,'$1_$2').toLowerCase()}
            if(names.size()!=count)throw new GradleException('Nursing test discovery incomplete: '+className)
            def prefix=className.replaceAll(/([a-z0-9])([A-Z])/,'$1_$2').toLowerCase()
            names.each {name->if(!cases.any{it.@name.text()=="prime_ants_test:${prefix}_${name}"})throw new GradleException('Missing nursing test: '+name)}
        }
        def placementNames = (file('src/gametest/java/dev/primeants/gametest/NaturalPlacementGameTest.java').text =~ /public void (\w+)\(GameTestHelper c\)/).collect { it[1].replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase() }
        if (placementNames.size()!=6) throw new GradleException('Placement discovery incomplete')
        placementNames.each { name -> if (!cases.any { it.@name.text()=="prime_ants_test:natural_placement_game_test_${name}" }) throw new GradleException('Missing placement test '+name) }
        def durabilityNames = (file('src/gametest/java/dev/primeants/gametest/PlacementDurabilityGameTest.java').text =~ /public void (\w+)\(GameTestHelper c\)/).collect { it[1].replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase() }
        if(durabilityNames.size()!=3)throw new GradleException('Placement durability discovery incomplete')
        durabilityNames.each {name->if(!cases.any{it.@name.text()=="prime_ants_test:placement_durability_game_test_${name}"})throw new GradleException('Missing placement durability test '+name)}
        ['TerrainRulesGameTest':9,'NestmateGameTest':3,'SoilContinuityGameTest':11,'NectarGameTest':11].each { className,count ->
            def names=(file("src/gametest/java/dev/primeants/gametest/${className}.java").text =~ /public void (\w+)\(GameTestHelper c\)/).collect {it[1].replaceAll(/([a-z0-9])([A-Z])/,'$1_$2').toLowerCase()}
            if(names.size()!=count)throw new GradleException('T16 required discovery incomplete: '+className)
            def prefix=className.replaceAll(/([a-z0-9])([A-Z])/,'$1_$2').toLowerCase()
            names.each {name->if(!cases.any{it.@name.text()=="prime_ants_test:${prefix}_${name}"})throw new GradleException('Missing T16 test: '+name)}
        }
        def additions=['lifecycle_game_test_environmental_chicken_loot_funds_new_worker_then_queen_death_ends_colony','soil_continuity_game_test_lowered_bamboo_survives_queen_preparation_and_restoration','soil_continuity_game_test_sideways_attachment_refuses_real_queen_excavation_with_read_only_survival','lifecycle_game_test_daylight_zombie_loot_travels_through_cache_and_nursing','lifecycle_game_test_genuine_unfed_workers_starve_before_their_birth_selected_age_limit','lifecycle_game_test_physical_meals_sustain_workers_until_age_death_and_persist_through_restore','lifecycle_game_test_queen_death_stops_laying_viable_cocoons_emerge_and_all_adults_die','lifecycle_game_test_birth_selected_capacity_keeps_unloaded_identities_and_death_releases_reservation','lifecycle_game_test_legacy_worker_age_adopts_stable_defaults_once_without_renewal','lifecycle_game_test_restored_protein_carrier_starves_releases_cargo_and_keeps_death_receipts']
        additions.each{n->if(!cases.any{it.@name.text()=='prime_ants_test:'+n})throw new GradleException('Missing T18 regression '+n)}
        def terminalNames=(file('src/gametest/java/dev/primeants/gametest/TerminalBroodGameTest.java').text =~ /public void (\w+)\(GameTestHelper c\)/).collect {it[1].replaceAll(/([a-z0-9])([A-Z])/,'$1_$2').toLowerCase()}
        if(terminalNames.size()!=15)throw new GradleException('T19 terminal discovery incomplete')
        terminalNames.each{n->if(!cases.any{it.@name.text()=='prime_ants_test:terminal_brood_game_test_'+n})throw new GradleException('Missing T19 terminal regression '+n)}
        def foodNames=(file('src/gametest/java/dev/primeants/gametest/NativeFoodGameTest.java').text =~ /public void (\w+)\(GameTestHelper c\)/).collect {it[1].replaceAll(/([a-z0-9])([A-Z])/,'$1_$2').toLowerCase()}
        foodNames.each{n->if(!cases.any{it.@name.text()=='prime_ants_test:native_food_game_test_'+n})throw new GradleException('Missing native food test '+n)}
        if(!cases.any{it.@name.text()=='prime_ants_test:player_basics_game_test_survival_body_enters_existing_stairs_and_inventory_drop_reaches_owned_cache'})throw new GradleException('Missing survival player case')
        if(cases.size()!=166+foodNames.size())throw new GradleException('Expected all 150 baseline cases and fifteen T19 regressions')
        if (report.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] }) {
            throw new GradleException('Server GameTest report contains a failure or skipped test')
        }
        logger.lifecycle("Verified server GameTest report: ${cases.size()} executed, 0 failed, 0 skipped")
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    testLogging { events 'passed', 'skipped', 'failed' }
}
